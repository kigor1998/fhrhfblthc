# Rebuilds chrome-extension/*.json: skycoach prices every 3 hours, MetaForge items once a day.
# The extension downloads the result from raw.githubusercontent.com (see background.js).
name: Update data

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Items from MetaForge
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 4 * * *'
        continue-on-error: true
        run: node tools/update-from-metaforge.js
      - name: Item prices from skycoach
        run: node tools/update-prices-skycoach.js
      - name: Bench prices from skycoach
        run: node tools/update-bench-prices-skycoach.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chrome-extension
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
